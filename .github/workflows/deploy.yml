# Builds, tests and publishes the website to GitHub Pages.
# Runs on every push to the main branch, and can be started by hand from the
# Actions tab ("Run workflow").
name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish if experimental data were committed
        run: node scripts/check-repo.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency versions from package-lock.json
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build for https://<user>.github.io/<repository>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Check the built site
        run: node scripts/check-build.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
